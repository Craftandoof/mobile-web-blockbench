name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install deps
        run: npm install --no-audit --no-fund --ignore-scripts
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - name: Build web into ./www
        run: npm run android:prepare
      - name: Add Android platform (first run only)
        run: test -d android || npx cap add android
      - name: Apply native overlay
        run: node scripts/android-overlay.mjs
      - name: Sync
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: blockbench-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
